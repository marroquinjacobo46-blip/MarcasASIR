<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>kahoot</title>

    <style>
        p:nth-child(2)>span:first-of-type {
            background-color: red;
        }

        p:nth-child(3)>span:nth-child(4) {
            background-color: green;
        }

        p {
            text-align: center;
        }

        span, b {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
        }

        p:nth-child(1)>span:nth-child(1) {
            background-color: blue;
        }
    </style>
</head>

<body>

    <p><b>*</b><span>1</span><span>2</span><span>3</span></p>

    <p><b>*</b><span>4</span><span>5</span><span>6</span></p>

    <p><b>*</b><span>7</span><span>8</span><span>9</span></p>

</body>
</html>
